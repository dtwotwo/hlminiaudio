name: Build

on:
  workflow_dispatch:
  push:
  pull_request:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  linux:
    name: Build and test Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: "4.3.7"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential ninja-build

      - name: Build HashLink
        run: |
          git clone --depth 1 https://github.com/HaxeFoundation/hashlink.git "$RUNNER_TEMP/hashlink-src"
          make -C "$RUNNER_TEMP/hashlink-src" -j"$(nproc)" libhl.so hl
          mkdir -p "$RUNNER_TEMP/hashlink/bin" "$RUNNER_TEMP/hashlink/include" "$RUNNER_TEMP/hashlink/lib"
          cp "$RUNNER_TEMP/hashlink-src/hl" "$RUNNER_TEMP/hashlink/bin/hl"
          cp "$RUNNER_TEMP/hashlink-src/libhl.so" "$RUNNER_TEMP/hashlink/lib/libhl.so"
          cp "$RUNNER_TEMP/hashlink-src/src/hl.h" "$RUNNER_TEMP/hashlink-src/src/hl_ffi.h" "$RUNNER_TEMP/hashlink/include/"
          echo "HASHLINK_ROOT=$RUNNER_TEMP/hashlink" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/hashlink/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/hashlink/lib" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake --preset linux-release

      - name: Build release
        run: cmake --build out/build/linux-release

      - name: Compile HL tests
        working-directory: tests/testMain
        run: |
          cp ../../out/build/linux-release/extension/miniaudio.hdll .
          haxe --version
          haxe test-hl.hxml

      - name: Run HL tests
        working-directory: tests/testMain
        run: |
          hl --version
          LD_LIBRARY_PATH="$PWD:$LD_LIBRARY_PATH" hl test.hl

      - name: Package Linux build
        run: |
          mkdir -p dist/linux
          cp out/build/linux-release/extension/miniaudio.hdll dist/linux/
          cp LICENSE* dist/linux/
          tar -czf hlminiaudio-linux.tar.gz -C dist/linux .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: hlminiaudio-linux
          path: hlminiaudio-linux.tar.gz

  build:
    name: Build native
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: vln-devsecops/actions-msvc@release/v1
        with:
          arch: x64

      - name: Download HashLink
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/HaxeFoundation/hashlink/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like 'hashlink-*-win.zip' } | Select-Object -First 1
          if (-not $asset) {
            throw 'Could not find a Windows HashLink release asset.'
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'hashlink-win.zip'
          Expand-Archive -LiteralPath 'hashlink-win.zip' -DestinationPath 'hashlink' -Force

          $hashlinkDir = Get-ChildItem -Path 'hashlink' -Directory | Select-Object -First 1
          if (-not $hashlinkDir) {
            throw 'Could not locate the extracted HashLink directory.'
          }

          "HASHLINK=$($hashlinkDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($hashlinkDir.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        run: cmake --preset release

      - name: Build release
        run: cmake --build out/build/release --config Release

      - name: Stage native build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist/native' | Out-Null
          Copy-Item 'out/build/release/extension/miniaudio.hdll' 'dist/native/miniaudio.hdll'
          Copy-Item 'out/build/release/extension/miniaudio.lib' 'dist/native/miniaudio.lib'

      - name: Save native build
        uses: actions/cache/save@v5.0.5
        with:
          path: dist/native
          key: ${{ runner.os }}-hlminiaudio-native-${{ github.run_id }}-${{ github.run_attempt }}

  test:
    name: Test Haxe ${{ matrix.haxe-version }}
    needs: build
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        haxe-version: ["4.3.7", "latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ matrix.haxe-version }}

      - name: Download HashLink
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/HaxeFoundation/hashlink/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like 'hashlink-*-win.zip' } | Select-Object -First 1
          if (-not $asset) {
            throw 'Could not find a Windows HashLink release asset.'
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'hashlink-win.zip'
          Expand-Archive -LiteralPath 'hashlink-win.zip' -DestinationPath 'hashlink' -Force

          $hashlinkDir = Get-ChildItem -Path 'hashlink' -Directory | Select-Object -First 1
          if (-not $hashlinkDir) {
            throw 'Could not locate the extracted HashLink directory.'
          }

          "HASHLINK=$($hashlinkDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($hashlinkDir.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore native build
        uses: actions/cache/restore@v5.0.5
        with:
          path: dist/native
          key: ${{ runner.os }}-hlminiaudio-native-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage test native files
        shell: pwsh
        run: Copy-Item 'dist/native/miniaudio.hdll' 'tests/testMain/miniaudio.hdll' -Force

      - name: Compile HL tests
        working-directory: tests/testMain
        run: |
          haxe --version
          haxe test-hl.hxml

      - name: Run HL tests
        working-directory: tests/testMain
        run: |
          hl --version
          hl test.hl

  package:
    name: Package release
    needs: [test, linux]
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore native build
        uses: actions/cache/restore@v5.0.5
        with:
          path: dist/native
          key: ${{ runner.os }}-hlminiaudio-native-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: hlminiaudio-linux
          path: .

      - name: Stage license files
        shell: pwsh
        run: Copy-Item 'LICENSE*' 'dist/native/' -Force

      - name: Verify packaged files
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/native/miniaudio.hdll')) {
            throw 'Missing dist/native/miniaudio.hdll'
          }
          if (-not (Test-Path 'dist/native/miniaudio.lib')) {
            throw 'Missing dist/native/miniaudio.lib'
          }
          if (-not (Get-ChildItem -Path 'dist/native' -File -Filter 'LICENSE*')) {
            throw 'Missing dist/native/LICENSE*'
          }
          if (-not (Test-Path 'hlminiaudio-linux.tar.gz')) {
            throw 'Missing hlminiaudio-linux.tar.gz'
          }

      - name: Create release zip
        shell: pwsh
        run: |
          if (Test-Path 'hlminiaudio-windows.zip') {
            Remove-Item 'hlminiaudio-windows.zip' -Force
          }
          Compress-Archive -Path 'dist/native/*' -DestinationPath 'hlminiaudio-windows.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hlminiaudio-windows
          path: hlminiaudio-windows.zip

      - name: Update nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'nightly'
          $windowsAsset = 'hlminiaudio-windows.zip'
          $linuxAsset = 'hlminiaudio-linux.tar.gz'
          $notes = @'
          Automated nightly Windows and Linux builds of `hlminiaudio`.

          Download the archive for your platform and extract it where you want to keep the native files.
          '@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if (-not $releaseExists) {
            gh release create $tag $windowsAsset $linuxAsset `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'Nightly Release' `
              --notes $notes `
              --prerelease

            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to create the nightly release.'
            }
            exit 0
          }

          # Keep the same published release; only move the tag and replace the asset.
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" `
            -f sha=$env:GITHUB_SHA `
            -F force=true

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to move the nightly tag.'
          }

          gh release upload $tag $windowsAsset $linuxAsset `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to replace the nightly assets.'
          }

      - name: Upload published release assets
        if: github.event_name == 'release' && github.event.action == 'published'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' `
            'hlminiaudio-windows.zip' `
            'hlminiaudio-linux.tar.gz' `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to upload the release assets.'
          }
